name: Build and release

on:
  push:
    # The release below reuses this same tag. On the workflow_dispatch path
    # the workflow creates it, which cannot re-trigger this workflow because
    # tags made with GITHUB_TOKEN never start workflow runs.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

  workflow_dispatch:

# For creating the release and its tag.
permissions:
  contents: write
  pull-requests: write # Required to open pull requests

env:
  # Keep in step with mise.toml and lint.yml.
  FLUTTER_VERSION: 3.47.0

jobs:
  release-android:
    name: Create Android release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      # storeFile is resolved relative to android/app, where the signing config
      # lives. compileSdk/targetSdk/minSdk/ndkVersion are in the build file --
      # they used to be injected here, which meant no one could build a clone.
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Check for outdated dependencies
        run: flutter pub outdated

      # --- THE OUTDATED CHECK STEP ---
      - name: Check for compatible updates
        id: outdated-check
        run: |
          echo "Fetching outdated report..."
          JSON_DATA=$(flutter pub outdated --json)
          
          # Count packages where current version doesn't match the resolvable (compatible) version
          COMPATIBLE_COUNT=$(echo "$JSON_DATA" | jq '[.packages[] | select(.current.version != .resolvable.version)] | length')

          echo "Found $COMPATIBLE_COUNT packages with compatible updates."
          
          # Set the output variable for next steps
          if [ "$COMPATIBLE_COUNT" -gt 0 ]; then
            echo "has_compatible_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_compatible_updates=false" >> "$GITHUB_OUTPUT"
          fi

      # --- EXAMPLE OF NEXT STEP USING THE RESULT ---
      - name: Conditional Next Step (Updates available)
        if: ${{ steps.outdated-check.outputs.has_compatible_updates == 'true' }}
        run: |
          echo "⚠️ Warning: Safe package upgrades are waiting!"
          # echo "You should run 'flutter pub upgrade' locally."
          # Add any custom notification, comment logic, or auto-PR tool here.
          echo "Running 'flutter pub upgrade'."
          flutter pub upgrade

      # - name: Conditional Next Step (Everything up-to-date)
      #   if: ${{ steps.outdated-check.outputs.has_compatible_updates == 'false' }}
      #   run: |
      #     echo "✅ Clean build! No compatible dependency updates required."

      - name: Create Pull Request
        if: ${{ steps.outdated-check.outputs.has_compatible_updates == 'true' }}
        # github.event.pull_request.head.repo.full_name == github.repository && 
        uses: peter-evans/create-pull-request@v8
        with:
          draft: true
          token: ${{ secrets.PE_CPR_PAT }}

          # The branch name where changes will be pushed
          branch: automated-feature-updates
          
          # Auto-deletes the branch once the PR is merged
          delete-branch: true 
          
          # Custom PR details
          title: "chore: automated documentation updates"
          body: "This PR was automatically generated by GitHub Actions to update repo assets."
          commit-message: "chore: update documentation and logs"
          
          # Optional metadata
          labels: |
            automated-pr
            documentation

      - name: Upgrade dependencies
        if: 0 == 1
        run: flutter pub upgrade --dry-run

      - name: Analyze project source
        run: dart analyze --fatal-infos

      - name: Run tests
        run: flutter test

      # The Flutter Gradle Plugin adds 1000 * ABI_VERSION to versionCode here.
      - name: Build Flutter (APK)
        run: flutter build apk --release -Pdisable-abi-filtering=true

      - name: Extract version from pubspec.yaml
        id: extract_version
        run: |
          version=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          # Strip the +versionCode: that is Android upgrade bookkeeping, not
          # part of the release name.
          echo "VERSION=${version%%+*}" >> $GITHUB_ENV

      # The trigger tag and the release tag are the same now, so the tag
      # existing proves nothing -- check for the release itself, and skip it
      # on a re-run for an already-released version.
      - name: Check if this version is already released
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ env.VERSION }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ env.VERSION }} already released; bump the version in pubspec.yaml to release again."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract applicationId from android/gradle.properties
        id: extract_app_id
        run: |
          app_id=$(sed -n 's/^android\.applicationId=//p' android/gradle.properties)
          echo "APPID=${app_id}" >> $GITHUB_ENV

      - name: Rename APK
        shell: bash
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/${{ env.APPID }}_${{ env.VERSION }}.apk"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: Releases
          path: |
            "build/app/outputs/flutter-apk/${{ env.APPID }}_${{ env.VERSION }}.apk"

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/app/outputs/flutter-apk/${{ env.APPID }}_${{ env.VERSION }}.apk"
          tag: v${{ env.VERSION }}
          # The built-in token, so there is no PAT to expire -- the previous one
          # did, and every release silently failed with 401 once it had.
          token: ${{ secrets.GITHUB_TOKEN }}
